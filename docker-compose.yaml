services:
  api:
    build: .
    container_name: urbansoccer_api
    ports:
      - "8000:8000"
    volumes:
      - ./urbansoccer_server:/app/urbansoccer_server
    environment:
      # Suas variáveis de ambiente existentes
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: urbansoccer_db
      SECRET_KEY: Joao2006@
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Adicionamos a URL do Ollama para o container da API saber onde ele está
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      mongo:
        condition: service_healthy
      ollama: # <-- NOVO: A API agora também depende do Ollama
        condition: service_started
    command: uvicorn urbansoccer_server.main:app --host 0.0.0.0 --port 8000 --reload

  mongo:
    image: mongo:7
    container_name: urbansoccer_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 }).ok' | grep 1 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama: # <-- NOVO SERVIÇO OLLAMA
    image: ollama/ollama
    container_name: urbansoccer_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  mongo_data:
  ollama_data: